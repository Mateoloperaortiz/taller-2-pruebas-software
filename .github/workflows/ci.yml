name: Pruebas del Taller 2

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit test with stub
        run: python -m pytest test_unit_with_stub.py -v
      - name: Run integration test with fake
        run: |
          export PYTHONPATH=$GITHUB_WORKSPACE
          python -m pytest test_integration_with_fake.py -v
      - name: Run web integration tests
        run: python -m pytest test_app.py -v
